services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: disaster_tweets:runtime
    env_file:
      - .env.runtime
    ports:
      # Runtime platforms often provide PORT; keep host/container ports aligned.
      - "${PORT:-10000}:${PORT:-10000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '10000') + '/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
