services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: disaster_tweets:full
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Persist SQLite prediction logs across container rebuilds.
      - disaster_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  disaster_data:
